<body>
<main>
  <h1>企業 CEO 社群媒體研究 問卷分配中</h1>
  <p id="message">正在隨機分派問卷，請稍候…</p>
  <a id="fallback" class="action" href="#" hidden>若未自動跳轉，請點此繼續</a>
  <p id="status" role="status" aria-live="polite"></p>
  </main>
<script>
'use strict';
// ====== 管理者設定：修改這裡即可 ======
const SURVEYS = [
  { id: 'CHV_ACC', enabled: true,  url: 'https://www.surveycake.com/s/d9Woq' },
  { id: 'CHV_DEF', enabled: true,  url: 'https://www.surveycake.com/s/Xe1qr' },
  { id: 'OV_ACC',  enabled: true,  url: 'https://www.surveycake.com/s/zan82'  },
  { id: 'OV_DEF',  enabled: true,  url: 'https://www.surveycake.com/s/lADVL'  }
];
// 若更換正式研究或需要重新開始分派，請修改此版本號。
const STUDY_VERSION = 'main-study-v1';
// ========================================
const storageKey = 'thesis-assignment-' + STUDY_VERSION;
const fallback = document.getElementById('fallback');
const message = document.getElementById('message');
const status = document.getElementById('status');
const active = SURVEYS.filter(s => s.enabled && isValidUrl(s.url));
function isValidUrl(url) {
  try { const u = new URL(url); return u.protocol === 'https:' && u.hostname !== 'example.com'; }
  catch { return false; }
}
function getSaved() {
  try { return localStorage.getItem(storageKey); } catch { return null; }
}
function save(id) {
  try { localStorage.setItem(storageKey, id); } catch { /* private browsing may block storage */ }
}
function chooseRandom(items) {
  const buffer = new Uint32Array(1);
  const limit = Math.floor(4294967296 / items.length) * items.length;
  do { crypto.getRandomValues(buffer); } while (buffer[0] >= limit);
  return items[buffer[0] % items.length];
}
if (active.length === 0) {
  message.textContent = '目前暫停收件。';
  status.textContent = '目前沒有開放中的問卷，請稍後再試。';
} else {
  // 同一瀏覽器盡可能維持原分派；關閉的組別不會再被選中。
  const prior = active.find(s => s.id === getSaved());
  const selected = prior || chooseRandom(active);
  save(selected.id);

  // 備用連結與自動跳轉使用同一個已抽中的網址，不會重抽。
  fallback.href = selected.url;
  fallback.hidden = false;
  message.textContent = '正在前往問卷…';
  status.textContent = '如果沒有自動跳轉，請點擊按鈕繼續。';

  // 使用 replace 避免返回鍵重新回到分派頁面。
  // 部分 APP 內建瀏覽器可能阻擋自動跳轉，故保留可手動點擊的連結。
  window.location.replace(selected.url);
}
</script>
